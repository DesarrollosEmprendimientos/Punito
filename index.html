<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia - Pasajeras</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <!-- Librería para el escaneo de QR mediante la cámara -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body>
    <div class="container">
        <h1>Control de Asistencia</h1>
        <p class="instruction">Toca el ícono del puño para escanear el código QR</p>
        
        <!-- Botón con tu imagen del puño -->
        <div id="scan-trigger" class="puño-container" title="Toca para escanear">
            <img src="puno.png" alt="Escanear QR" id="puño-img">
        </div>

        <!-- Contenedor de la cámara (Oculto hasta que se presiona el puño) -->
        <div id="reader-container" style="display:none;">
            <div id="reader"></div>
            <button id="cancel-btn">Cancelar</button>
        </div>

        <div id="result"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
