<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escáner QR - Lista de Pasajeras</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f4f4f9;
      margin: 0;
      padding: 20px;
    }
    .logo-container {
      margin-bottom: 20px;
    }
    .logo-container img {
      max-width: 150px;
      height: auto;
    }
    #reader {
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }
  </style>
  <!-- Librería del lector QR -->
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

  <!-- Logo de la APP (Asegúrate de que 'tu-logo-real.png' coincida con el nombre de tu archivo) -->
  <div class="logo-container">
    <img src="puno.png" alt="Logo App" id="app-logo">
    <h2>Control de Asistencia</h2>
  </div>

  <!-- Vista del Escáner QR -->
  <div id="reader"></div>

  <!-- Script principal -->
  <script src="app.js"></script>
</body>
</html>
